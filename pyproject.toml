[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-atlas"
version = "0.1.0"
description = "Real-time fraud detection pipeline and demo web app"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" }
authors = [
  { name = "Fraud Atlas Project" },
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.6",
  "sqlalchemy>=2.0,<3.0",
  "pyotp>=2.9",
  "qrcode>=7.4",
  "pillow>=10.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7.4",
  "requests>=2.28",
  "prometheus-client>=0.16",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pre-commit>=4.4",
  "black>=24.3",
  "ruff>=0.0.283",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = ["py312"]
